<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="width:232px;height:100%;background:var(--dark2);border-right:1px solid color-mix(in oklab, var(--light1) 28%, transparent);display:flex;flex-direction:column;padding:18px 12px 14px;box-sizing:border-box;gap:14px;font-family:'Winky Sans',system-ui,sans-serif;color:var(--light2)">
  <div style="display:flex;align-items:center;gap:10px;padding:0 8px">
    <div style="position:relative;width:28px;height:28px;border-radius:14px;overflow:hidden;background:var(--dark1);box-shadow:0 0 0 2px var(--light1)">
      <div style="position:absolute;left:0;right:0;top:0;height:50%;background:rgb(219,112,112)"></div>
      <div style="position:absolute;left:0;right:0;top:12px;height:4px;background:var(--dark2)"></div>
      <div style="position:absolute;left:9px;top:9px;width:10px;height:10px;border-radius:5px;background:var(--light2);box-shadow:0 0 0 2px var(--dark2)"></div>
    </div>
    <div style="font-size:20px;font-weight:800;letter-spacing:-.01em">PokeChill</div>
  </div>
  <sc-if value="{{ battling }}" hint-placeholder-val="{{ false }}">
    <div style="border-radius:14px;background:var(--dark1);padding:10px 12px;display:flex;flex-direction:column;gap:6px;border:1px solid color-mix(in oklab, rgb(130,211,130) 45%, transparent)">
      <div style="display:flex;align-items:center;gap:6px;font-size:11px;color:rgb(130,211,130);font-weight:700"><span style="width:7px;height:7px;border-radius:4px;background:rgb(130,211,130);box-shadow:0 0 8px rgb(130,211,130)"></span>IN BATTLE</div>
      <div style="font-size:14px;font-weight:700">Cerulean Cave</div>
      <div style="height:4px;border-radius:2px;background:color-mix(in oklab, var(--light1) 25%, transparent);overflow:hidden"><div style="width:64%;height:100%;background:rgb(130,211,130)"></div></div>
    </div>
  </sc-if>
  <sc-for list="{{ groups }}" as="g" hint-placeholder-count="4">
    <div style="display:flex;flex-direction:column;gap:2px">
      <div style="font-size:10px;letter-spacing:.14em;color:var(--light1);padding:0 10px 4px">{{ g.title }}</div>
      <sc-for list="{{ g.items }}" as="it" hint-placeholder-count="4">
        <div style="height:33px;border-radius:10px;padding:0 10px;display:flex;align-items:center;gap:10px;background:{{ it.bg }};color:{{ it.color }};opacity:{{ it.op }};cursor:pointer" style-hover="background:color-mix(in oklab, var(--dark2), white 6%)">
          <span style="width:18px;text-align:center;font-size:14px">{{ it.glyph }}</span>
          <span style="flex:1;font-size:14px;font-weight:{{ it.weight }}">{{ it.label }}</span>
          <sc-if value="{{ it.hasKbd }}" hint-placeholder-val="{{ false }}"><span style="font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--light1);border:1px solid color-mix(in oklab, var(--light1) 40%, transparent);border-radius:4px;padding:0 5px">{{ it.kbd }}</span></sc-if>
          <sc-if value="{{ it.dot }}" hint-placeholder-val="{{ false }}"><span style="width:8px;height:8px;border-radius:4px;background:#FF4671"></span></sc-if>
          <sc-if value="{{ it.hasMeta }}" hint-placeholder-val="{{ false }}"><span style="font-size:10px;color:var(--light1);font-variant-numeric:tabular-nums">{{ it.meta }}</span></sc-if>
          <sc-if value="{{ it.locked }}" hint-placeholder-val="{{ false }}"><svg width="10" height="11" viewBox="0 0 9 10"><rect x="0.5" y="4" width="8" height="5.5" rx="1.2" fill="var(--light1)"></rect><path d="M2.3 4V2.8a2.2 2.2 0 0 1 4.4 0V4" fill="none" stroke="var(--light1)" stroke-width="1.3"></path></svg></sc-if>
        </div>
      </sc-for>
    </div>
  </sc-for>
  <div style="margin-top:auto;display:flex;flex-direction:column;gap:8px;padding:0 4px">
    <div style="display:flex;gap:6px">
      <div style="flex:1;height:30px;border-radius:15px;background:var(--dark1);display:flex;align-items:center;gap:6px;padding:0 10px;font-size:12px;font-variant-numeric:tabular-nums"><span style="width:12px;height:12px;border-radius:6px;background:#b9b9c6"></span>12,480</div>
      <div style="flex:1;height:30px;border-radius:15px;background:var(--dark1);display:flex;align-items:center;gap:6px;padding:0 10px;font-size:12px;font-variant-numeric:tabular-nums"><span style="width:12px;height:12px;border-radius:6px;background:#e7c14a"></span>36</div>
    </div>
    <div style="font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--light1);padding:0 6px">v3.4 · offline · autosaved</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:232,&quot;height&quot;:900},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;travel&quot;,&quot;vs&quot;,&quot;battle&quot;,&quot;team&quot;,&quot;bag&quot;,&quot;dex&quot;],&quot;default&quot;:&quot;travel&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;battling&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active ?? 'travel';
    const b = this.props.battling === true || this.props.battling === 'true';
    const lockInBattle = ['vs', 'team', 'training', 'dimension'];
    const it = (k, glyph, label, o = {}) => {
      const on = a === k;
      const locked = o.locked || (b && lockInBattle.includes(k));
      return { glyph, label, kbd: o.kbd || '', hasKbd: !!o.kbd && !locked, dot: !!o.dot, meta: o.meta || '', hasMeta: !!o.meta, locked,
        bg: on ? 'var(--light2)' : 'transparent', color: on ? 'var(--dark1)' : 'var(--light2)', weight: on ? 800 : 500, op: locked ? 0.45 : 1 };
    };
    return {
      battling: b,
      groups: [
        { title: 'PLAY', items: [it('travel', '◎', 'Travel', { kbd: '1' }), it('vs', '◆', 'VS', { kbd: '2' }), it('battle', '◉', 'Battle', { kbd: '3', locked: false }), it('team', '⬡', 'Team', { kbd: '4' }), it('bag', '▣', 'Items', { kbd: '5' }), it('dex', '▤', 'Pokédex', { kbd: '6' })] },
        { title: 'FACILITIES', items: [it('mart', '◇', 'Poké-Mart'), it('training', '△', 'Training'), it('genetics', '⌬', 'Genetics', { locked: true })] },
        { title: 'REWARDS', items: [it('gift', '✉', 'Mystery Gift', { dot: true }), it('export', '⇪', 'Export Reward'), it('wonder', '↻', 'Wonder Trade', { meta: '7:12:40' })] },
        { title: 'INFO', items: [it('dict', '≣', 'Dictionary'), it('guide', '?', 'Guide'), it('settings', '⚙', 'Settings')] }
      ]
    };
  }
}
</script>
</body>
</html>
